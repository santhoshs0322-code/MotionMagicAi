<form method="get" class="panel filters"><div><label for="start">From (India)</label><input type="date" name="start" id="start" value="{{ filters.start|date:'Y-m-d' }}" required></div><div><label for="end">Through (inclusive)</label><input type="date" name="end" id="end" value="{{ filters.end|date:'Y-m-d' }}" required></div><div><label for="user">User ID · blank for all</label><input name="user" id="user" value="{{ filters.user }}" maxlength="128"></div><div><label for="group">Group by</label><select id="group" name="group"><option value="day" {% if filters.group == 'day' %}selected{% endif %}>Day</option><option value="month" {% if filters.group == 'month' %}selected{% endif %}>Month</option><option value="user" {% if filters.group == 'user' %}selected{% endif %}>User</option></select></div><button>Apply filters</button></form>

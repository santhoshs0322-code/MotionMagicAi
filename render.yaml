# Render-first staging with external PostgreSQL and Valkey services (for example, Aiven).
# Applying this Blueprint creates only the paid API service.
# All application-owned settings use MOTION_AI_. PORT/RENDER_* are supplied by Render.
services:
  - type: web
    name: motionmagic-api
    runtime: docker
    branch: dev
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend-django
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    preDeployCommand: python manage.py migrate --noinput && python manage.py sync_gemini_rates
    healthCheckPath: /ready
    envVars:
      - key: MOTION_AI_DJANGO_SECRET
        generateValue: true
      - key: MOTION_AI_JWT_SECRET
        generateValue: true
      - key: MOTION_AI_DATABASE_URL
        sync: false
      - key: MOTION_AI_REDIS_URL
        sync: false
      - key: MOTION_AI_PROXY_MODE
        value: render
      - key: MOTION_AI_DEBUG
        value: "false"
      - key: MOTION_AI_TESTING
        value: "false"
      - key: MOTION_AI_SSL_REDIRECT
        value: "true"
      - key: MOTION_AI_WEB_WORKERS
        value: "1"
      - key: MOTION_AI_WEB_THREADS
        value: "2"
      - key: MOTION_AI_AUTH_ENABLED
        value: "false"
      - key: MOTION_AI_MARKUP_BPS
        value: "15000"
      - key: MOTION_AI_STORE_FEE_BPS
        value: "0"
      - key: MOTION_AI_DAILY_PROVIDER_BUDGET_PAISE
        value: "0"
      - key: MOTION_AI_S3_BUCKET
        sync: false
      - key: MOTION_AI_AWS_REGION
        value: ap-south-1
      - key: MOTION_AI_AWS_ACCESS_KEY_ID
        sync: false
      - key: MOTION_AI_AWS_SECRET_ACCESS_KEY
        sync: false
      - key: MOTION_AI_GEMINI_API_KEY
        sync: false
      - key: MOTION_AI_GEMINI_LITE_1K_COST_PAISE
        value: "0"
      - key: MOTION_AI_GEMINI_NANO_21_1K_COST_PAISE
        value: "0"
      - key: MOTION_AI_GEMINI_OMNI_720P_COST_PAISE_PER_SECOND
        value: "0"
      - key: MOTION_AI_PLAY_ENABLED
        value: "false"

# Render-first staging with an external PostgreSQL database (for example, Aiven).
# Applying this Blueprint creates a paid API service and a free shared cache.
# All application-owned settings use MOTION_AI_. PORT/RENDER_* are supplied by Render.
services:
  - type: web
    name: motionmagic-api
    runtime: docker
    branch: dev
    region: singapore
    plan: 0.5c-512mb
    rootDir: backend-django
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    preDeployCommand: python manage.py migrate --noinput
    healthCheckPath: /ready
    envVars:
      - key: MOTION_AI_DJANGO_SECRET
        generateValue: true
      - key: MOTION_AI_JWT_SECRET
        generateValue: true
      - key: MOTION_AI_DATABASE_URL
        sync: false
      - key: MOTION_AI_REDIS_URL
        fromService:
          type: keyvalue
          name: motionmagic-cache
          property: connectionString
      - key: MOTION_AI_PROXY_MODE
        value: render
      - key: MOTION_AI_DEBUG
        value: "false"
      - key: MOTION_AI_TESTING
        value: "false"
      - key: MOTION_AI_SSL_REDIRECT
        value: "true"
      - key: MOTION_AI_WEB_WORKERS
        value: "1"
      - key: MOTION_AI_WEB_THREADS
        value: "2"
      - key: MOTION_AI_AUTH_ENABLED
        value: "false"
      - key: MOTION_AI_MARKUP_BPS
        value: "15000"
      - key: MOTION_AI_STORE_FEE_BPS
        value: "0"
      - key: MOTION_AI_DAILY_PROVIDER_BUDGET_PAISE
        value: "0"
      - key: MOTION_AI_PLAY_ENABLED
        value: "false"
  - type: keyvalue
    name: motionmagic-cache
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
